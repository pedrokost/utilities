---
- hosts: localhost
  user: pedro
  connection: local
  become: yes

  vars:
    - is_home_laptop: true

  vars_files:
    - vars/main.yml

  pre_tasks:
    - name: Update apt cache if needed
      apt: update_cache=yes cache_valid_time=3600
      tags: pre_tasks

    
  roles:
    - role: webarchitect609.flameshot
    - role: baztian.calibre
    - role: oefenweb.dropbox
    - role: zzet.rbenv
      rbenv_users:
        - pedro
    - role: gantsign.visual-studio-code
    - role: joplin
      users:
        - username: pedro
          settings:
            - { key: "sidebarVisibility", val: "1" }
            - { key: "dateFormat", val: "YYYY-MM-DD" }
            - { key: "sync.target", val: "5" }
    # - role: lciolecki.virtualenvwrapper # FIMXE: Requires pip3. Fails otherwise.

  tasks:
    - name: Remove broken Ubuntu PPA for Ansible (not working on focal)
      apt_repository:
        repo: "ppa:ansible/ansible"
        state: absent
        update_cache: yes

    # - name: Remove broken AppImageLauncher PPA (not working on noble)
    #   apt_repository:
    #     repo: "ppa:appimagelauncher-team/stable"
    #     state: absent
    #     update_cache: yes
    #   ignore_errors: yes

    - name: Remove old Sublime Text GPG key from legacy keyring
      apt_key:
        id: 1EDDE2CD3FC2D0B2
        state: absent
      ignore_errors: yes

    - name: Remove old Sublime Text repository file
      file:
        path: /etc/apt/sources.list.d/sublime-text.list
        state: absent

    - name: Create APT keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Sublime Text GPG key
      shell: curl -fsSL https://download.sublimetext.com/sublimehq-pub.gpg | gpg --dearmor -o /etc/apt/keyrings/sublimehq-pub.gpg
      args:
        creates: /etc/apt/keyrings/sublimehq-pub.gpg

    - name: Add APT repository for Sublime Text
      apt_repository:
        filename: sublime-text.list
        repo: "deb [signed-by=/etc/apt/keyrings/sublimehq-pub.gpg] https://download.sublimetext.com/ apt/stable/"
        update_cache: yes

    - name: Add required PPA repositories
      apt_repository:
        repo: "{{item}}"
        update_cache: yes
      with_items: "{{ppas}}"

    #- name: Update APT repository
    #  apt:
    #      update_cache: yes # todo only if above changed?

    - name: Install apt packages
      apt:
        name: "{{ apt_installed_packages }}"
        state: latest

    - name: Install apt packages for Ubuntu 22.04 only
      apt:
        name: "{{ apt_installed_packages_22_04_only }}"
        state: latest
      when: ansible_distribution_release == 'jammy'

    #- name: Install img2pdf
    #  pip:
    #    name: img2pdf

    # - name: Install Youtube-DL
    #   pip:
    #     name: youtube_dl

    - include_tasks:
        file: tasks/zsh.yml

    #- include_tasks:
    #    file: tasks/mullvad.yml

    # Regolith Version-Specific Package Management
    - name: Check Regolith version for package management
      command: cat /etc/regolith/version
      register: regolith_version_output
      failed_when: false
      check_mode: false
      changed_when: false

    - name: Extract Regolith version number for package management
      set_fact:
        regolith_version: "{{ regolith_version_output.stdout | regex_search('REGOLITH_VERSION=(.+)', '\\1') | first }}"
      when: regolith_version_output.rc == 0

    - name: Install Regolith version-specific packages
      block:
        # Check for config directories
        - name: Check if Regolith 1 config directory exists
          stat:
            path: "{{ ansible_env.HOME }}/.config/regolith"
          register: check_path_regolith_v1_config

        - name: Check if Regolith 2 config directory exists
          stat:
            path: "{{ ansible_env.HOME }}/.config/regolith2"
          register: check_path_regolith_v2_config

        - name: Check if Regolith 3 config directory exists
          stat:
            path: "{{ ansible_env.HOME }}/.config/regolith3"
          register: check_path_regolith_v3_config

        # Install version-specific packages
        - name: Install Regolith 1 packages
          apt:
            name: "{{ regolith_v1_v2_packages }}"
            state: present
          when: 
            - check_path_regolith_v1_config.stat.exists
            - regolith_version is defined 
            - regolith_version[0] == '1'
            - regolith_manage_packages | default(true)

        - name: Install Regolith 2 packages
          apt:
            name: "{{ regolith_v1_v2_packages }}"
            state: present
          when: 
            - check_path_regolith_v2_config.stat.exists
            - regolith_version is defined 
            - regolith_version[0] == '2'

        # Regolith 3 package management
        - name: Detect session type for Regolith 3 package management
          set_fact:
            regolith3_session_type: "{{ ansible_env.XDG_SESSION_TYPE | default('x11') }}"
          when: 
            - check_path_regolith_v3_config.stat.exists
            - regolith_version is defined 
            - regolith_version[0] == '3'

        - name: Install Regolith 3 X11 packages
          apt:
            name: "{{ regolith_v3_x11_packages }}"
            state: present
          when: 
            - check_path_regolith_v3_config.stat.exists
            - regolith_version is defined 
            - regolith_version[0] == '3'
            - regolith3_session_type == 'x11'

        - name: Install Regolith 3 Wayland packages
          apt:
            name: "{{ regolith_v3_wayland_packages }}"
            state: present
          when: 
            - check_path_regolith_v3_config.stat.exists
            - regolith_version is defined 
            - regolith_version[0] == '3'
            - regolith3_session_type == 'wayland'

      when: regolith_version_output.rc == 0

    - include_tasks:
        file: tasks/dotfiles.yml
